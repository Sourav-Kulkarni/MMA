site_name: "Kali Training"
site_description: "Personal Filipino Martial Arts training journal — Kali / Arnis / Eskrima"
site_author: "Sourav"
docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    # Light mode — default on first load
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: brown
      accent: brown
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: brown
      accent: brown
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Lora
    code: JetBrains Mono
  icon:
    logo: material/book-open-variant
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - search.share
    - content.tabs.link
    - content.code.copy
    - content.tooltips
    - toc.follow

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang: en
  - glightbox:
      touchNavigation: true
      loop: true
      effect: zoom
      width: 100%
      height: auto
      zoomable: true
      draggable: true
  # - git-revision-date-localized:
  #     enable_creation_date: true
  #     type: timeago
  #     fallback_to_build_date: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - footnotes
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: On this page

nav:
  - Home: index.md
  - Fundamentals:
    - fundamentals/index.md
    - Stances & Footwork: fundamentals/stances.md
    - Weapon Grips: fundamentals/grips.md
    - 12 Angles of Attack: fundamentals/striking-angles.md
  - Weapons:
    - weapons/index.md
    - Single Stick: weapons/single-stick.md
    - Double Stick: weapons/double-stick.md
    - Knife (Daga): weapons/knife.md
  - Drills:
    - drills/index.md
    - Sinawali: drills/sinawali.md
    - Sombrada: drills/sombrada.md
    - Sparring: drills/sparring.md
  - Conditioning:
    - conditioning/index.md
    - Warm-Up: conditioning/warmup.md
    - Strength & Power: conditioning/strength.md
    - Recovery: conditioning/recovery.md
  - Resources:
    - resources/index.md
    - Glossary: resources/glossary.md
    - Lineage & History: resources/lineage.md